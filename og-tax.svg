<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#f8f9fc"/>
  <rect x="0" y="0" width="1200" height="6" fill="#2563eb"/>
  <!-- Left accent panel -->
  <rect x="0" y="0" width="420" height="630" fill="#eff6ff"/>
  <!-- Category icon area -->
  <rect x="80" y="220" width="100" height="100" rx="20" fill="#2563eb"/>
  <text x="130" y="286" font-family="Georgia,serif" font-size="52" fill="white" text-anchor="middle">£</text>
  <!-- Site name -->
  <text x="80" y="90" font-family="-apple-system,system-ui,Arial,sans-serif" font-size="22" font-weight="700" fill="#2563eb">Calculators.Finance</text>
  <!-- Category -->
  <text x="80" y="178" font-family="-apple-system,system-ui,Arial,sans-serif" font-size="15" font-weight="600" fill="#2563eb" letter-spacing="3">TAX &amp; PAY</text>
  <!-- Right side content -->
  <text x="480" y="160" font-family="-apple-system,system-ui,Arial,sans-serif" font-size="52" font-weight="800" fill="#0f172a" letter-spacing="-1">Tax &amp; Pay</text>
  <text x="480" y="218" font-family="-apple-system,system-ui,Arial,sans-serif" font-size="52" font-weight="800" fill="#2563eb" letter-spacing="-1">Calculators</text>
  <!-- Tools list -->
  <text x="480" y="308" font-family="-apple-system,system-ui,Arial,sans-serif" font-size="22" fill="#334155">Take-Home Pay Calculator</text>
  <text x="480" y="348" font-family="-apple-system,system-ui,Arial,sans-serif" font-size="22" fill="#334155">Salary Sacrifice Calculator</text>
  <text x="480" y="388" font-family="-apple-system,system-ui,Arial,sans-serif" font-size="22" fill="#334155">Pension Contribution Calculator</text>
  <text x="480" y="428" font-family="-apple-system,system-ui,Arial,sans-serif" font-size="22" fill="#64748b">+ VAT, Salary to Hourly &amp; more</text>
  <!-- Badge -->
  <rect x="480" y="490" width="264" height="40" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="612" y="515" font-family="-apple-system,system-ui,Arial,sans-serif" font-size="16" font-weight="600" fill="#2563eb" text-anchor="middle">HMRC 2025/26 Rates</text>
</svg>
